<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Atlas · CMU 11-768 AI Agents, step by step</title>
<link rel="stylesheet" href="styles.css">
<script>document.documentElement.dataset.theme = localStorage.getItem('theme') || 'light'</script>
</head>
<body>
<header class="top">
  <button id="menu" class="icon-btn" aria-label="Open course menu" aria-controls="drawer" aria-expanded="false">
    <svg viewBox="0 0 20 20" width="18" height="18"><path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
  </button>
  <a class="brand" href="#/">
    <svg viewBox="0 0 32 32" width="26" height="26" aria-hidden="true"><path d="M16 4l11 6-11 6-11-6z" fill="#f2c14e" stroke="#4a3f30" stroke-width="1.4" stroke-linejoin="round"/><path d="M5 10v9l11 6v-9z" fill="#d9a83a" stroke="#4a3f30" stroke-width="1.4" stroke-linejoin="round"/><path d="M27 10v9l-11 6v-9z" fill="#b7a3ec" stroke="#4a3f30" stroke-width="1.4" stroke-linejoin="round"/></svg>
    <span>Agent <em>Atlas</em></span>
  </a>
  <div class="search">
    <input id="q" type="search" placeholder="Search lessons…" aria-label="Search lessons" autocomplete="off">
    <kbd>Ctrl K</kbd>
    <ul id="results" role="listbox" hidden></ul>
  </div>
  <span class="course-tag">CMU 11-768</span>
  <button id="theme" class="icon-btn" aria-label="Toggle dark mode">
    <svg viewBox="0 0 20 20" width="17" height="17"><path d="M15.5 12.5A6.5 6.5 0 0 1 7.5 4.5a6.5 6.5 0 1 0 8 8z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
  </button>
</header>

<aside id="drawer" aria-label="Course"></aside>
<div id="scrim" hidden></div>

<div class="layout">
  <main>
    <div class="lesson-head">
      <div>
        <p class="crumb" id="crumb"></p>
        <h1 id="title"></h1>
        <p class="summary" id="summary"></p>
      </div>
      <div class="chips" id="chips"></div>
    </div>
    <section class="stage-card">
      <div class="metrics" id="metrics"></div>
      <div class="stage">
        <svg id="svg" role="img" aria-label="Isometric diagram of the current step"></svg>
        <div class="beat" id="beat" hidden>
          <button id="beat-prev" class="icon-btn sm" aria-label="Previous message ([)" title="Previous message ([)">‹</button>
          <span id="beat-text" aria-live="polite"></span>
          <button id="beat-next" class="icon-btn sm" aria-label="Next message (])" title="Next message (])">›</button>
        </div>
        <div class="info-card" id="info" hidden></div>
        <span class="stage-tip">Tip: click any object</span>
      </div>
      <div class="stage-foot">
        <span class="k req">request</span><span class="k res">result</span><span class="k hs">control</span>
        <span class="spacer"></span>
        <button id="voice" class="auto-btn" aria-pressed="false" title="Read each message aloud">🔈 Voice</button>
        <button id="auto" class="auto-btn" aria-pressed="false" title="Play the whole lesson">▶ Autoplay</button>
        <button id="speed" class="auto-btn speed" title="Animation speed" aria-label="Animation speed">1×</button>
        <button id="replay" class="icon-btn sm" aria-label="Replay animation (R)" title="Replay (R)">
          <svg viewBox="0 0 20 20" width="15" height="15"><path d="M4 10a6 6 0 1 0 2-4.5M4 3v3.5h3.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button id="pause" class="icon-btn sm" aria-label="Pause animation (Space)" title="Pause (Space)"></button>
      </div>
    </section>
    <section class="rail-card">
      <div class="rail-head"><b>In this lesson</b><span id="railpos"></span></div>
      <ol class="rail" id="rail"></ol>
    </section>
    <section class="learn" id="learn"></section>
  </main>
  <div class="side">
    <article class="panel" id="panel" aria-live="polite"></article>
  </div>
</div>

<div class="tip" id="tip" role="tooltip" hidden></div>
<aside class="reader" id="reader" aria-label="Course notes" hidden>
  <div class="reader-head"><b id="reader-title"></b><button class="icon-btn sm" id="reader-close" aria-label="Close notes" onclick="closeNote()">✕</button></div>
  <article class="reader-body" id="reader-body"></article>
</aside>
<script src="notes/manifest.js"></script>
<script src="reader.js"></script>
<script src="lessons/l01.js"></script>
<script src="lessons/t01.js"></script>
<script src="lessons/l02.js"></script>
<script src="lessons/t02.js"></script>
<script src="lessons/l03.js"></script>
<script src="lessons/t03.js"></script>
<script src="app.js"></script>
</body>
</html>
